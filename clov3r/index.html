function toggle_screen_black() {
    const screen = document.getElementsByClassName("screen").item(0);
    if (screen) {
        screen.classList.remove("screen");
        screen.classList.add("screen_black");
    }
    else {
        const screen_black = document.getElementsByClassName("screen_black").item(0);
        screen_black.classList.remove("screen_black");
        screen_black.classList.add("screen");
    }
}
